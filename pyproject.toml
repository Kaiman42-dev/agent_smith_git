[project]
name = "agent-smith-git"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "mcp>=1.22,<2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
sandbox = "sandbox.cli:main"

# Needed for uv to install the `sandbox` command
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["sandbox", "mcp_client.py", "mcp_bridge.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
